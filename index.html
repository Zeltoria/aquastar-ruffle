<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aquastar Ruffle - Fixed</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    #container{width:100%;height:100%}
    #fps-counter {
      position: absolute;
      top: 5px;
      left: 5px;
      color: #0f0;
      background-color: rgba(0,0,0,0.7);
      padding: 2px 8px;
      font-family: monospace;
      font-size: 12px;
      z-index: 1000;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="fps-counter">FPS: 0</div>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <script>
    const servers = {
      Twilly:      { host: 'socket5.aq.com',      port: 5588 },
      Artix:       { host: 'socket.aq.com',       port: 5588 },
      Yorumi:      { host: 'socket3.aq.com',      port: 5588 },
      Yokai:       { host: 'asia.game.artix.com', port: 5588 }
    };

    const choice = new URLSearchParams(location.search).get('server') || 'Twilly';
    const srv = servers[choice] || servers.Twilly;

    // Tambahkan Proxy CORS agar Ruffle bisa mendownload SWF dari server Artix
    const corsProxy = "https://cors-anywhere.azm.workers.dev/"; 
    const swfUrl = "https://game.aq.com/game/gamefiles/Loader_Spider.swf";

    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      logLevel: 'error',
      // PENTING: SocketProxy butuh server perantara (lihat langkah di bawah)
      socketProxy: [{
        host: srv.host,
        port: srv.port,
        proxyUrl: `ws://localhost:8181?host=${srv.host}&port=${srv.port}`
      }],
      allowFullscreen: true,
      autoplay: "on",
      unmuteOverlay: "hidden"
    };

    window.addEventListener('DOMContentLoaded', () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById('container').appendChild(player);

      player.load({
        url: corsProxy + swfUrl, // Menggunakan proxy untuk bypass CORS
        allowScriptAccess: true,
        parameters: {
          base: 'https://game.aq.com/game/gamefiles/',
          allowNetworking: 'all'
        }
      }).catch(e => console.error('Ruffle Error:', e));

      // FPS Counter
      let frameCount = 0;
      let lastTime = performance.now();
      const fpsElement = document.getElementById('fps-counter');
      function updateFPS() {
        frameCount++;
        const currentTime = performance.now();
        if (currentTime - lastTime >= 1000) {
          fpsElement.textContent = `FPS: ${Math.round((frameCount * 1000) / (currentTime - lastTime))}`;
          frameCount = 0;
          lastTime = currentTime;
        }
        requestAnimationFrame(updateFPS);
      }
      updateFPS();
    });
  </script>
</body>
</html>
