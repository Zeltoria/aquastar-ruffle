<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQW Mobile Fix</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    #container{width:100vw;height:100vh}
  </style>
</head>
<body>
  <div id="container"></div>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <script>
    // Proxy publik untuk menembus blokir CORS
    const proxy = "https://api.allorigins.win/raw?url=";
    const swf = "https://game.aq.com/game/gamefiles/Loader_Spider.swf";

    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      // Proxy socket ke localhost untuk Termux
      socketProxy: [{
        host: "socket5.aq.com",
        port: 5588,
        proxyUrl: "ws://localhost:8181"
      }]
    };

    window.addEventListener('load', () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById('container').appendChild(player);

      player.load({
        url: proxy + encodeURIComponent(swf),
        allowScriptAccess: true,
        parameters: {
          base: "https://game.aq.com/game/gamefiles/",
          allowNetworking: "all"
        }
      });
    });
  </script>
</body>
</html>
