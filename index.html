<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aquastar Ruffle - Fixed</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden; touch-action: none;}
    #container{width:100%;height:100%}
    #fps-counter {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #00ff00;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      font-family: monospace;
      font-size: 12px;
      z-index: 99;
      border-radius: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="fps-counter">FPS: 0</div>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <script>
    const servers = {
      Twilly: { host: 'socket5.aq.com', port: 5588 },
      Artix:  { host: 'socket.aq.com',  port: 5588 }
    };

    const choice = new URLSearchParams(location.search).get('server') || 'Twilly';
    const srv = servers[choice] || servers.Twilly;

    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      logLevel: 'error',
      // Agar bisa login, kamu harus menjalankan proxy di Termux (localhost:8181)
      socketProxy: [{
        host: srv.host,
        port: srv.port,
        proxyUrl: `ws://localhost:8181?host=${srv.host}&port=${srv.port}`
      }],
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on"
    };

    window.addEventListener('DOMContentLoaded', () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById('container').appendChild(player);

      player.load({
        // Memanggil file yang sudah kamu upload ke GitHub tadi
        url: 'Loader_Spider.swf', 
        allowScriptAccess: true,
        parameters: {
          base: 'https://game.aq.com/game/gamefiles/',
          allowNetworking: 'all'
        }
      }).catch(e => {
        console.error('Gagal memuat SWF:', e);
        alert('Pastikan file Loader_Spider.swf sudah di-upload ke GitHub!');
      });

      // FPS Counter
      let frameCount = 0;
      let lastTime = performance.now();
      const fpsElement = document.getElementById('fps-counter');
      function updateFPS() {
        frameCount++;
        const now = performance.now();
        if (now - lastTime >= 1000) {
          fpsElement.textContent = `FPS: ${Math.round((frameCount * 1000) / (now - lastTime))}`;
          frameCount = 0;
          lastTime = now;
        }
        requestAnimationFrame(updateFPS);
      }
      updateFPS();
    });
  </script>
</body>
</html>
